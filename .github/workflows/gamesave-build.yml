name: GameSave 后端构建

on:
  push:
    branches: [master, main]
    paths:
      - 'cms-gamesave/src/**'
      - 'cms-file/src/**'
      - 'cms-app/src/main/resources/db/migration/**'
      - 'cms-app/src/test/java/com/thx/module/gamesave/**'
      - 'pom.xml'
      - 'cms-*/pom.xml'
      - '.github/workflows/gamesave-build.yml'
  pull_request:
    paths:
      - 'cms-gamesave/src/**'
      - 'cms-file/src/**'
      - 'cms-app/src/main/resources/db/migration/**'
      - 'cms-app/src/test/java/com/thx/module/gamesave/**'
      - 'docs/modules/gamesave/**'
      - 'pom.xml'
      - 'cms-*/pom.xml'
      - '.github/workflows/gamesave-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 Maven 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 编译并打包
        shell: bash
        run: |
          set -o pipefail
          mvn -B -DskipTests package 2>&1 | tee maven-package.log
      - name: 执行库模块单元测试（无需外部基础设施）
        shell: bash
        run: |
          set -o pipefail
          # 只跑不依赖 MySQL/Redis/MinIO 的库模块单元测试；
          # 需要完整应用上下文的集成测试在 cms-app，由 gamesave-integration 与 Drone（带基础设施）执行。
          mvn -B test -pl cms-kernel,cms-file,cms-payment,cms-gamesave,cms-platform 2>&1 | tee maven-gamesave-test.log
      - name: 上传 Maven 构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamesave-maven-logs
          path: |
            maven-package.log
            maven-gamesave-test.log
          if-no-files-found: warn
          retention-days: 7
