kind: pipeline
name: gitee-drone

platform:
  os: linux
  arch: amd64

# Drone 由 Gitee 推送触发，并使用 Gitee 绑定凭据自动检出当前提交。
# 不再禁用 clone：先在 CI 里跑一遍构建与测试，通过后才允许部署，
# 避免旧配置那样「推送即部署」——编译不过或测试挂了也会直接上线。
services:
  # 集成测试需要真实 MySQL 与 Redis。镜像版本与生产保持一致：
  # 生产 MySQL 固定 5.7，SQL 必须按 5.7 兼容编写，这里用同版本才能真正验出兼容性问题。
  - name: mysql
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cms
  - name: redis
    image: redis:7-alpine

steps:
  # 数据库初始化必须单独用 mysql 镜像做：maven 镜像里没有 mysql / mysqladmin 客户端，
  # 在里面执行会因命令不存在而失败（且失败信息容易被重定向吞掉，表现为“等待超时”）。
  - name: init-database
    image: mysql:5.7
    commands:
      # service 容器被拉起不等于数据库已能接受连接，这里轮询直到 ping 通。
      - |
        set -eu
        for attempt in $(seq 1 60); do
          if mysqladmin ping -h mysql -uroot -proot --silent; then
            echo "MySQL 已就绪"
            break
          fi
          if [ "$attempt" = "60" ]; then
            echo "MySQL 启动超时"
            exit 1
          fi
          sleep 2
        done
      # 初始化各模块表结构。每个模块只有一个初始化 SQL，顺序不能颠倒：
      # platform 打底，file 必须在 gamesave 之前（gamesave 种子数据依赖 file_app/file_policy 表）。
      # 必须带 --default-character-set=utf8mb4，否则脚本里的中文会报 Incorrect string value。
      - |
        set -eu
        for f in docs/modules/platform/cms.sql \
                 docs/modules/file/schema.sql \
                 docs/modules/payment/schema.sql \
                 docs/modules/gamesave/schema.sql; do
          echo "导入 $f"
          mysql --default-character-set=utf8mb4 -h mysql -uroot -proot cms < "$f"
        done

  - name: verify
    image: maven:3.9.11-eclipse-temurin-21
    depends_on:
      - init-database
    environment:
      # 单元测试不依赖外部组件；需要数据库的集成测试通过下面这些变量连接 service 容器。
      # 这些变量只在 CI 内生效，连的是流水线里的一次性数据库，不涉及任何真实环境。
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
    commands:
      # clean 不能省：残留的旧构建产物会被打进 jar，
      # 曾导致已删除的 Flyway 脚本被重新执行。
      - mvn clean package -B -ntp

  - name: deploy
    image: appleboy/drone-ssh
    depends_on:
      - verify
    settings:
      host: 43.130.247.22
      port: 2222
      username: tanghaixin
      password:
        from_secret: ssh_password
      # 构建镜像（含 Maven 依赖下载与打包）耗时远超原来的 2m，超时会让部署中途被掐断。
      command_timeout: 30m
      script:
        - set -eu
        - sudo mkdir -p /app/cms
        - |
          if [ ! -d "/app/cms/cms/.git" ]; then
            echo "首次部署：从 Gitee 克隆仓库"
            sudo git clone --origin origin --branch master https://gitee.com/tang-haixin/cms.git /app/cms/cms
          fi
        - cd /app/cms/cms
        - sudo git fetch --prune origin master
        # 部署目录只作为 Gitee 代码副本，不保留服务器上的跟踪文件修改。
        # 强制切换到本次触发的精确提交：原来的 git pull 拿的是 master 最新状态，
        # 若期间有新推送就会部署成非本次验证过的代码。
        # --force 同时会清理历史 chmod 或手工修改留下的脏工作树，防止 checkout 被阻塞。
        - sudo git checkout --force --detach ${DRONE_COMMIT_SHA}
        # 直接交给 Bash 执行，不再 chmod，避免把 deploy.sh 的权限位改成未提交状态。
        - sudo env DEPLOY_RELEASE_TAG=${DRONE_COMMIT_SHA} bash ./deploy.sh

trigger:
  event:
    - push
  branch:
    - master
